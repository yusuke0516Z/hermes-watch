# Hermès 在庫監視（24時間稼働の主基盤）
#
# 【ループ方式にした理由（2026-08-14）】
#   当初は cron "*/5" で毎回起動していたが、GitHubは高頻度cronを混雑時に間引くため
#   実測で45〜65分間隔まで劣化していた。cronは約30分ごとの起動トリガーに格下げし、
#   1回の起動で hermes_monitor.py --loop が予算時間ぶん監視を繰り返す。
#
# 【ループを長時間化した理由（2026-08-14 夕・日次点検）】
#   28分ループにしても間隔劣化は解消しなかった（対策後の実測でも47〜116分間隔）。
#   原因はGitHubのscheduleトリガー自体の遅延で、cron側の小細工では直せない。
#   そこで「cronの正確さに依存しない」設計に変える:
#     - ループ予算を170分に延長（config.json の loop.budget_seconds が正本）
#     - cronは :13/:43 のまま高頻度に残す＝起動の取りこぼしに対する保険
#     - 走行中に発火したcronは下の concurrency により pending で待機し、
#       走行中のrunが終わった瞬間に起動する → 実質連続監視になり、
#       cronが多少遅れても間引かれても監視の穴が生まれない
#   これで取得回数は実測32回/日（設計の19%）から設計値168回/日に戻る。
#   クレジットは月約28,200→151,200（枠200,000内・設計どおりの消費）。
#
# 監視間隔・時間帯・予算・クレジット試算の正本は config.json の "loop" セクション。
# このファイルには数値を書かない（分散させない）。
# ScrapFly失敗・クレジット切れ時は無料キャッシュ経路へ自動フォールバック（LINEに1回警告）。
name: hermes-monitor

on:
  schedule:
    # :00/:30 はGitHubの混雑ピークで間引かれやすい（公式も正時を避けるよう推奨）ため外す。
    # 毎時1回で足りる理由（2026-08-15）: ランが約170分走り続けるため、走行中に発火した
    # cronが常に1本pendingで控えており、run終了と同時に次が始まる（連続監視）。
    # 30分ごとに戻すとpendingの置き換えでcancelled表示が1日約48件出て、
    # 異常が起きた時に本物の失敗がノイズに埋もれる。
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "通知を送らず1回だけ動作確認する"
        type: boolean
        default: false

# 連続監視の要。cancel-in-progress: false により、走行中に発火したcronは
# キャンセルされずpendingで待ち、走行中のrunが終わり次第すぐ起動する。
# runが異常終了した場合も次のcron（最大30分後）が拾うので自己修復する。
concurrency:
  group: hermes-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    # config.json の loop.budget_seconds(170分) + checkout/state push のぶん。
    # GitHubのジョブ上限は6時間なので、予算を伸ばす時もここが先に効くようにしておく。
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v5

      - name: Monitor
        env:
          HERMES_SMTP_USER: ${{ secrets.HERMES_SMTP_USER }}
          HERMES_SMTP_PASSWORD: ${{ secrets.HERMES_SMTP_PASSWORD }}
          HERMES_RECIPIENT: ${{ secrets.HERMES_RECIPIENT }}
          HERMES_FAILURE_ALERT_TO: ${{ secrets.HERMES_FAILURE_ALERT_TO }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 hermes_monitor.py --once --no-jitter --dry-run
          else
            # ループ内の想定外クラッシュは Python 側で数え、全滅時のみ exit 1 で
            # このジョブを失敗させる（GitHubの失敗通知が飛ぶ）。部分的な失敗では止めない。
            python3 hermes_monitor.py --loop
          fi

      - name: Persist state and freshness data
        if: always()
        run: |
          # 【マージ方式にした理由（2026-08-15）】
          # 170分走る間にリモートへ別コミットが入ると、freshness.jsonl の追記同士が
          # git rebase では解決不能な競合になり、旧実装の pull --rebase リトライは
          # 3回とも同じ理由で失敗していた（2026-08-14に2件の実失敗）。
          # → gitのテキストマージに頼らず、毎試行「最新のリモートに勝ち乗せ」する:
          #   自分の結果を退避 → reset --hard origin/main → merge_state.py で意味的に統合。
          # これならどんな競合・レースでも再試行のたびに解消される。
          git config user.name "hermes-monitor[bot]"
          git config user.email "hermes-monitor@users.noreply.github.com"
          cp state/products.json /tmp/ours_state.json 2>/dev/null || true
          cp logs/freshness.jsonl /tmp/ours_fresh.jsonl 2>/dev/null || true
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 merge_state.py /tmp/ours_state.json /tmp/ours_fresh.jsonl
            git add -f state/products.json logs/freshness.jsonl
            if git diff --cached --quiet; then
              echo "no state change"
              exit 0
            fi
            git commit -m "state: update [skip ci]"
            if git push origin main; then
              exit 0
            fi
            echo "push failed (attempt $i) — retrying in $((i*10))s"
            sleep $((i*10))
          done
          # stateが保存できていない＝次runで同じイベントを再検知し重複通知が起きうる。
          # 無音で流さず、ジョブを失敗させて気づけるようにする（監視自体は次のcronで再開する）
          echo "::error::state push failed after 3 attempts"
          exit 1
